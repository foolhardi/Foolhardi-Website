    <style>

        body {
                    overflow-x: hidden;
                    background-color: chocolate;
                   
                }

             
                .room {
                    width: 100%;
                    position: relative;
                    transform: scale(1);
                   
                }
                .room span {
                    opacity: 0;
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    font-size: calc(1rem + 1.75vw);
                    color: #FFF;
                    line-height: 1;
                    filter: drop-shadow(1px 1px 0 black)
                        drop-shadow(-1px 1px 0 black) 
                        drop-shadow(1px -1px 0 black) 
                        drop-shadow(-1px -1px 0 black);
                    text-transform: uppercase;
                    z-index: 99;
                }

        .rotate, .appear {
                width: fit-content;
			height: fit-content;
			display: inline-block;
			position: absolute;
			color: transparent; background:transparent;
            
        }
        .rotate:hover { 
            transform: scale(1.5);
        } 

        .door {
            width: fit-content;
			height: fit-content;
			display: inline-block;
			position: absolute;
			color: transparent; background:transparent;  
        }

        .door:hover{
            transform: scale(1.05);
        }
        


            </style>
</head>
