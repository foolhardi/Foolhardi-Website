<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafts</title>

<style>
* {box-sizing: border-box}

@font-face {
  font-family: "Averia";
  src:
    local("Averia"),
    url("font/Averia-Regular.ttf") format("opentype") 
    }

    h1 , h3 , p , li , a , ul, summary {
        font-family: 'Averia';
        color: hotpink;
    }

    body {
        background-color: black;
        background-image: url("bgimg/flower 1.png");

    }


/* Style the tab */
.tab {
  float: left;
  border: 1px dashed hotpink;
  border-radius: 10px;
  background-color: #000000;
  width: 30%;
  height: 300px;
}

/* Style the buttons that are used to open the tab content */
.tab button {
  display: block;
  background-color: inherit;
  color: black;
  padding: 22px 16px;
  width: 100%;
  border: none;
  outline: none;
  text-align: left;
  cursor: pointer;
  transition: 0.3s;
}

/* Change background color of buttons on hover */
.tab button:hover {
  background-color: #98cdff;
}

/* Create an active/current "tab button" class */
.tab button.active {
  background-color: pink;
}

/* Style the tab content */
.tabcontent {
  float: left;
  padding: 0px 12px;
  border: 1px hotpink;
  width: 70%;
  border-left: none;
  border-radius: 10px;
  height: 300px;
}

</style>
</head>
<body>
    <div class="tab">
        <button class="tablinks" onclick="openCity(event, 'Soldering')"id="defaultOpen">Soldering</button>
        <button class="tablinks" onclick="openCity(event, 'Sockdolls')">Sock Dolls</button>
        <button class="tablinks" onclick="openCity(event, 'Clothes')">Clothes</button>
      </div>
      
      <div id="Soldering" class="tabcontent">
        <h3>Soldering</h3>
        
      </div>
      
      <div id="Sockdolls" class="tabcontent">
        <h3>Sockdolls</h3>
        
      </div>
      
      <div id="Clothes" class="tabcontent">
        <h3>Clothes</h3>
        
      </div> 

<script>
    function openCity(evt, cityName) {
  // Declare all variables
  var i, tabcontent, tablinks;

  // Get all elements with class="tabcontent" and hide them
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }

  // Get all elements with class="tablinks" and remove the class "active"
  tablinks = document.getElementsByClassName("tablinks");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }

  // Show the current tab, and add an "active" class to the link that opened the tab
  document.getElementById(cityName).style.display = "block";
  evt.currentTarget.className += " active";

  
} 
document.getElementById("defaultOpen").click();
</script>
</body>
</html>
