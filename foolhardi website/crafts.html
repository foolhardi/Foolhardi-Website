<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafts</title>

    <style>
   
        @font-face {
        font-family: "Averia";
        src:
          local("Averia"),
          url("font/Averia-Regular.ttf") format("opentype") 
          }
      
          h1 , h3 , p , li , a , ul, summary {
              font-family: Averia;
              color: hotpink;
          }
      
          body {
              background-color: black;
              background-image: url("bgimg/flower 1.png");
      
          }
      
          .header {
              text-align: center;
          
          }
          
          .container {  
              border: 2px;
              border-color: hotpink;
              border-style: dashed;
              border-radius: 10px;
              display: flex;
              flex-wrap: wrap;
              margin-left: 380px;
              margin-right: 380px;
              padding: 10px;
          }
      
          /* Sidebar/left column */
          .nav {
              border: 2px;
              border-color: hotpink;
              border-style: solid;
              border-radius: 10px;
              flex: 20%;
              padding: 20px;
              margin: 10px;
              background-color: black;
              opacity: 70%;
          }
      
          .nav h3 , h4 {
              text-align: center;
          }
      
      
          .nav ul {
              list-style-type: none;
              
          }
      
          .nav li {
              margin: 5px;
      
          }
      
          .navimg {
              display: block;
              text-align: center;
          }
      
      
          .navbutton {
              border: 2px;
              border-color: hotpink;
              border-style: solid;
              border-radius: 9px;
              padding: 10px;
              margin: 0px;
              display: block;
              text-align: center;
              text-decoration: none;
      
          }
      
          .navbutton img {
              max-width: 88px;
              
          }
      
          .navbutton:hover {
              background-color: lightgray;
          }
      
          /* Main column */
          .main {
              border: 2px;
              border-color: hotpink;
              border-style: solid;
              border-radius: 10px;
              flex: 60%;
              padding-left: 50px;
              padding-right: 50px;
              padding-top: 20px;
              padding-bottom: 100px;
              text-align: center;
              margin: 10px;
              background-color: black;
             
              
              
          }
      
          .wrapped-image {
              float: left; /* Only applies to the image with this class */
              margin: 10px; /* Adds space around this image */
          
          }
      
      
      
          .about {
              border: 2px;
              border-color: hotpink;
              border-style: solid;
              border-radius: 10px;
              padding: 20px;
              text-align: left;
              margin-bottom: 9px;
              background-color: black;
              opacity: 70%;
              
          }
          
      
          .buttons {
              border: 2px;
              border-color: hotpink;
              border-style: solid;
              border-radius: 10px;
              padding-bottom: 5px;
              padding-top: 5px;
              text-align: center;
              margin-bottom: 9px;
              background-color: black;
              opacity: 70%;
      
          }
           
          .pixels {
              display: block;
              margin-left: auto;
              margin-right: auto;
              max-width: 200px;
          }
      
          
      
      
          footer {
              position: fixed;
              bottom: 0;
              left:0;
              width: 100%;
              text-align: center;
              z-index: 1000;
          }
      
      
      
      
      
      </style>    

    
</head>
<body>

    <p>my baby loves me like a saint</p>
    
</body>
</html>
